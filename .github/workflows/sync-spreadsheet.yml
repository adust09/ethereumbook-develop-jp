name: Sync Spreadsheet Data

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run sync script
        run: python3 scripts/sync_spreadsheet.py

      - name: Check for changes
        id: changes
        run: git diff --quiet || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glosary.md people.md translation-rule.md
          git commit -m "docs: sync translation reference files from spreadsheet"
          git push
