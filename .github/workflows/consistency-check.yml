name: Translation Consistency Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'glosary.md'
      - 'scripts/test_consistency.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_consistency.py
