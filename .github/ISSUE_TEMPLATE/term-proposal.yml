name: 用語提案
description: 用語集への新規用語追加または既存用語の修正を提案する
title: "[用語] "
labels: ["glossary"]
body:
  - type: input
    id: english_term
    attributes:
      label: 英語用語
      placeholder: "例: merkle proof"
    validations:
      required: true
  - type: input
    id: current_translation
    attributes:
      label: 現在の訳語（既存用語の修正の場合）
      placeholder: "glosary.md に登録済みの訳語"
  - type: input
    id: proposed_translation
    attributes:
      label: 提案する訳語
      placeholder: "例: マークルプルーフ"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・参考資料
      description: 提案訳語の根拠となる情報（JIS規格、業界標準など）
    validations:
      required: true
  - type: checkboxes
    id: usage
    attributes:
      label: 確認事項
      options:
        - label: glosary.md を確認し、既存の登録内容を把握しました
          required: true
        - label: translation-rule.md のカタカナ表記ルールを確認しました
          required: true
